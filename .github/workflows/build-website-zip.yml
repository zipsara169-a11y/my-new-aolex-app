name: Build APLEX website ZIP

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "website-source/**"
      - "README-SI.md"
      - "APP-INFO.txt"
      - "package.json"
      - ".github/workflows/build-website-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Create website package
        run: |
          mkdir -p dist
          zip -r dist/APLEX-MOVIES-WEBSITE-UPDATED.zip www website-source README-SI.md APP-INFO.txt package.json capacitor.config.ts src scripts .github/workflows -x "*/node_modules/*" "*/.git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APLEX-MOVIES-WEBSITE-UPDATED
          path: dist/APLEX-MOVIES-WEBSITE-UPDATED.zip
          if-no-files-found: error
          retention-days: 14
